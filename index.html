<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tıpatıp Aynı Neon Parçacıklı Kalp Animasyonu</title>
    <style>
        /* CSS: Orijinal videodaki koyu, derin siyah atmosferi yakalar */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000; /* Derin siyah arka plan */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #00ff7f; /* Yardımcı metin rengi (gerekirse) */
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            /* Parıltıyı daha diffuse ve yumuşak hale getirmek için CSS filtreleri */
            filter: blur(0.8px) contrast(1.1) brightness(1.1);
        }

        #error-msg {
            display: none;
            position: absolute;
            color: red;
            background: rgba(0,0,0,0.8);
            padding: 10px;
        }
    </style>
</head>
<body>

    <div id="error-msg">Canvas yüklenemedi. Lütfen tarayıcınızı kontrol edin.</div>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const errorMsg = document.getElementById('error-msg');

        // Canvas yüklendi mi kontrol et
        if (!ctx) {
            errorMsg.style.display = 'block';
            console.error("Canvas context alınamadı.");
        }

        // Ekran boyutuna göre canvas'ı ayarla
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- KONFİGÜRASYON (Tıpatıp aynı parçacık detayı için) ---
        const config = {
            particleCountPerFrame: 20, // Her karede fışkıran parçacık sayısı (videodaki yoğun bulut için)
            particleLife: 120, // Parçacıkların yaşam süresi (ne kadar uzun kalacakları)
            particleSize: { min: 0.8, max: 2.2 }, // Parçacık boyutları (tıpatıp aynı mikro noktalar)
            particleSpeed: { min: -0.8, max: 0.8 }, // Yayılma hızı (kalpten dışarı bulut etkisi)
            glowBlur: 10, // Neon parıltısının yumuşaklığı (son görseldeki gibi puslu)
            trailOpacity: 0.06 // Hareket izinin belirginliği (iz bırakma efekti)
        };

        const particles = [];
        let time = 0; // Çizim zamanlayıcısı
        let hue = 130; // Başlangıç rengi (Yeşil)

        // --- PARÇACIK SINIFI ---
        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.hue = hue; // Çizildiği anın rengini alır
                
                // Rastgele mikro boyutlar (tıpatıp aynı noktacıklar için)
                this.size = Math.random() * (config.particleSize.max - config.particleSize.min) + config.particleSize.min;
                
                // Kalp formülünden dışarı doğru yumuşak bir yayılma (bulut etkisi)
                this.speedX = (Math.random() - 0.5) * (config.particleSpeed.max - config.particleSpeed.min) + config.particleSpeed.min;
                this.speedY = (Math.random() - 0.5) * (config.particleSpeed.max - config.particleSpeed.min) + config.particleSpeed.min;
                
                this.life = config.particleLife; // Yaşam süresi
                this.opacity = 1; // Solma başlangıcı
            }

            update() {
                // Parçacık hareket eder
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Zamanla yavaşlama (friction)
                this.speedX *= 0.99;
                this.speedY *= 0.99;
                
                // Yaşlandıkça solma
                this.life -= 1;
                this.opacity = this.life / config.particleLife;

                // Hafifçe küçülme (isteğe bağlı, videoda belirgin değil ama yumuşatır)
                if (this.size > 0.2) this.size -= 0.01;
            }

            draw() {
                // Renk ve opaklık (HSL kullanıyoruz, videodaki gibi tam geçiş)
                ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${this.opacity})`;
                
                ctx.beginPath();
                // Yumuşak ışık noktaları (tıpatıp aynı parçacık detayı)
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Neon parıltı (Canvas düzeyinde, son görseldeki pusluluk için)
                ctx.shadowBlur = config.glowBlur;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 65%, 0.8)`;
            }
        }

        // --- ANA ANİMASYON DÖNGÜSÜ ---
        function animate() {
            // İz bırakma efekti: Canvas'ı tam temizlemek yerine yumuşak siyahla kaplarız
            ctx.fillStyle = `rgba(0, 0, 0, ${config.trailOpacity})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parıltıyı çizime yansıtmak için resetleme
            ctx.shadowBlur = 0;

            // 1. Kalp pozisyonunu hesapla (Parametrik Kalp Formülü - Cardioid)
            const x = 16 * Math.pow(Math.sin(time), 3);
            const y = -(13 * Math.cos(time) - 5 * Math.cos(2 * time) - 2 * Math.cos(3 * time) - Math.cos(4 * time));
            
            // Ölçeklendirme (Kalbi ekrana sığdır)
            const scale = Math.min(canvas.width, canvas.height) / 45;
            const heartX = x * scale + canvas.width / 2;
            const heartY = y * scale + canvas.height / 2;

            // 2. Renk döngüsünü ayarla (Videodaki yeşil -> sarı -> mor geçişi için)
            hue = (hue + 0.4) % 360; // Hafifçe artar
            // Orijinal videoda daha belirgin bir yeşil->sarı->mor->yeşil döngüsü var. 
            // Bu basit döngü buna benzer bir his verecektir.

            // 3. Her karede, kalp formülünün o anki noktasından yeni parçacıklar fışkırt
            for (let i = 0; i < config.particleCountPerFrame; i++) {
                particles.push(new Particle(heartX, heartY, hue));
            }

            // 4. Tüm parçacıkları güncelle ve çiz
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                
                // Ölen parçacıkları temizle (performans için)
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Çizim hızını ve formülün ilerlemesini kontrol et (videoya tıpatıp uyumlu hız)
            time += 0.012; // Çizim hızı

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
