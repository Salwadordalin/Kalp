<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Heart Animation</title>
    <style>
        /* CSS: Videodaki o derin siyah arka plan ve tam ekran yerleşimi */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000; /* Saf siyah */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            display: block;
            /* Hafif bir parlama efekti ekleyerek videodaki derinliği artırıyoruz */
            filter: blur(0.5px) contrast(1.2);
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Ekran boyutuna göre ayarla
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = [];
        const particleCount = 1200; // Videodaki o yoğun görünüm için

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.t = Math.random() * Math.PI * 2; // Kalp üzerindeki başlangıç açısı
                this.size = Math.random() * 1.5 + 0.5; // Parçacık boyutu
                this.speed = Math.random() * 0.015 + 0.005; // Dönüş hızı
                this.hue = 130; // Başlangıç rengi (Yeşil)
                this.opacity = Math.random() * 0.5 + 0.5;
                
                // Kalp denklemi koordinatları
                this.updateCoords();
            }

            updateCoords() {
                // Parametrik Kalp Formülü
                const x = 16 * Math.pow(Math.sin(this.t), 3);
                const y = -(13 * Math.cos(this.t) - 5 * Math.cos(2 * this.t) - 2 * Math.cos(3 * this.t) - Math.cos(4 * this.t));
                
                // Ölçeklendirme (Ekran boyutuna göre kalbi büyütme)
                const scale = Math.min(canvas.width, canvas.height) / 45;
                this.x = x * scale + canvas.width / 2;
                this.y = y * scale + canvas.height / 2;
            }

            update() {
                this.t += this.speed;
                this.updateCoords();

                // Renk geçişi: Yeşil (130) -> Sarı (60) -> Mor/Pembe (280+)
                this.hue += 0.4;
                if (this.hue > 320) this.hue = 130; 
            }

            draw() {
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Videodaki o parlamayı (glow) sağlamak için
                ctx.shadowBlur = 4;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, 0.8)`;
            }
        }

        // Parçacıkları oluştur
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            // "Trail" (İz) efekti: Her karede ekranı tam siyah yapmak yerine 
            // çok hafif şeffaf siyahla kaplıyoruz. Bu, hareket edenlerin arkasında iz bırakır.
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
