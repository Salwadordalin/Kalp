<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kalp Animasyonu</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050505; /* Videodaki koyu arka plan */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Ekran boyutunu ayarla
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let particles = [];
        let angle = 0;
        let hue = 120; // Yeşilden başlıyor

        // Kalp çizim formülü
        function heartMath(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        class Particle {
            constructor(x, y, h) {
                this.x = x;
                this.y = y;
                this.color = `hsl(${h}, 100%, 65%)`;
                
                // Parçacıkların etrafa rastgele saçılması (Videodaki toz bulutu efekti)
                const a = Math.random() * Math.PI * 2;
                const speed = Math.random() * 1.5 + 0.1;
                this.vx = Math.cos(a) * speed;
                this.vy = Math.sin(a) * speed;
                
                this.life = 1; // Başlangıç opaklığı
                this.decay = Math.random() * 0.015 + 0.01; // Sönme hızı
                this.size = Math.random() * 2 + 0.5; // Küçük boyutlar
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            // Önceki kareyi temizle
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Öncü noktanın (Head) konumunu hesapla
            const pos = heartMath(angle);
            const scale = Math.min(canvas.width, canvas.height) / 45;
            const hx = canvas.width / 2 + pos.x * scale;
            const hy = canvas.height / 2 + pos.y * scale;

            // Öncü noktayı (Parlayan ışık) çiz
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 25;
            ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(hx, hy, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // Parçacıklara gölge uygulamamak için sıfırla

            // Yeni parçacıklar üret (Kuyruk kısmı)
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(hx, hy, hue));
            }

            // Parçacıkları güncelle ve çiz
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw(ctx);
                }
            }
            
            ctx.globalAlpha = 1;

            angle += 0.025; // Kalbin çizim hızı
            hue += 0.35; // Renklerin yeşilden mora dönüş hızı

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
